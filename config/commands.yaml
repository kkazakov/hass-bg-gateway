# Starter command catalogue. Replace the example entities with your own.
#
# A fuller real-home example (hall light, scenes, indoor/outdoor temperature)
# lives in commands-example.yaml. Point BGV_COMMANDS_FILE at it to try it.
#
# Mapping (choose one per command):
#   action:  call a Home Assistant service directly
#   query:   read an entity and return a spoken answer (speak: true)
#   neither: call an intent_script by the command name
#
# `phrases` are what you can say. `hotwords` bias the ASR toward device words.

language: bg

match:
  threshold: 88   # RapidFuzz WRatio, 0-100
  margin: 5       # best must beat second-best by this much

commands:
  LightOn:
    speak: false
    phrases:
      - "включи лампата"
      - "светни лампата"
    hotwords:
      - "лампата"
    action:
      service: light.turn_on
      target:
        entity_id: light.living_room   # <-- your entity
      response: "Включих лампата."

  LightOff:
    speak: false
    phrases:
      - "изключи лампата"
      - "изгаси лампата"
    hotwords:
      - "лампата"
    action:
      service: light.turn_off
      target:
        entity_id: light.living_room   # <-- your entity
      response: "Изключих лампата."

  OutsideTemperature:
    speak: true
    phrases:
      - "каква е температурата навън"
      - "колко градуса е навън"
    hotwords:
      - "температурата"
      - "навън"
    query:
      entity_id: sensor.outside_temperature   # <-- your entity
      round: 0
      unit: "градуса"
      unit_singular: "градус"
      template: "В момента температурата навън е {value} {unit}."
