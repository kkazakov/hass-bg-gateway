# Home Assistant instances the gateway may talk to.
# Copy to instances.yaml and fill in. Prefer token_env over an inline token.

default: home

instances:
  home:
    url: http://homeassistant.local:8123
    token_env: HA_HOME_TOKEN
    verify_tls: true
    timeout_s: 10

  # Second home / office. Give each one its own commands file only if the
  # intents differ; otherwise the same commands.yaml works for both and the
  # client picks the instance with ?instance=office.
  #
  # office:
  #   url: https://office.example.com
  #   token_env: HA_OFFICE_TOKEN
  #   verify_tls: true
