# Full example catalogue from a real home: hall light, night light,
# all-lights scenes, indoor and outdoor temperature.
#
# The starter file is commands.yaml. To use this file instead, either
#   - set BGV_COMMANDS_FILE=commands-example.yaml in .env, or
#   - copy it over commands.yaml.
# Replace the entity ids with your own before running the actions.
#
# `targets` compose every built-in on/off verb with every phrase:
#   "включи лампата в хола"  -> light.turn_on light.light2
#   "загаси лампата в хола"  -> light.turn_off light.light2
#   "пусни всички светлини"  -> scene.turn_on scene.all_lights_on
#   "изключи всички лампи"   -> scene.turn_on scene.all_lights_off
#
# A target can be written compactly as `phrase: entity.id`. Use `entity:` for
# the same entity in both directions, or `on:`/`off:` when they differ (scenes
# always use scene.turn_on, including the off scene).
#
# `commands` stays for custom full-phrase commands. A query (temperature)
# keeps the exact same shape as before: `speak: true` plus `query:`.

language: bg

match:
  threshold: 88   # RapidFuzz WRatio, 0-100
  margin: 5       # best must beat second-best by this much

# Optional extra verb synonyms; built-in defaults always remain active.
verbs:
  on: []
  off: []

targets:
  лампата в хола:
    phrases:
      - "лампата в хола"
      - "лампите в хола"
      - "осветлението в хола"
    hotwords:
      - "лампата"
      - "хола"
    entity: light.light2

  нощното осветление:
    phrases:
      - "нощно осветление"
      - "нощното осветление"
    hotwords:
      - "нощното"
      - "осветление"
    entity: scene.night_light   # a scene only supports "on"

  всички светлини:
    phrases:
      - "осветлението"
      - "всички светлини"
      - "всички лампи"
    hotwords:
      - "всички"
      - "светлини"
      - "лампи"
    on: scene.all_lights_on
    off: scene.all_lights_off

commands:
  # A custom action for a phrase without a verb. The generated target still
  # handles "включи нощното осветление" and the other on verbs.
  NightLight:
    speak: false
    phrases:
      - "нощно осветление"
    action:
      service: scene.turn_on
      target:
        entity_id: scene.night_light
      response: "Включих нощното осветление."

  HallTemperature:
    speak: true
    phrases:
      - "каква е температурата в хола"
      - "каква е температурата вътре"
      - "колко градуса е в хола"
      - "температурата в хола"
    hotwords:
      - "температурата"
      - "хола"
    query:
      entity_id: sensor.down_temperature
      round: 1
      unit: "градуса"
      unit_singular: "градус"
      template: "В момента температурата в хола е {value} {unit}."

  OutsideTemperature:
    speak: true
    phrases:
      - "каква е температурата навън"
      - "каква е температурата отвън"
      - "колко градуса е навън"
      - "каква е температурата вън"
    hotwords:
      - "температурата"
      - "навън"
    query:
      entity_id: sensor.outside_temp
      round: 0
      unit: "градуса"
      unit_singular: "градус"
      template: "В момента температурата навън е {value} {unit}."

  # Custom full-phrase example: override one generated phrase with a custom
  # reply (explicit commands win over an identical target phrase).
  #
  # HallLightOffQuiet:
  #   speak: false
  #   phrases:
  #     - "изключи лампата в хола"
  #   action:
  #     service: light.turn_off
  #     target:
  #       entity_id: light.light2
  #     response: "Изключих лампата в хола."

  # Intent-script mode (no action/query): HA must define an intent_script
  # entry with this exact name. Example:
  #
  # CorridorLightOn:
  #   speak: false
  #   phrases:
  #     - "светни лампата в коридора"
  #     - "включи лампата в коридора"
  #   hotwords: ["лампата", "коридора"]
